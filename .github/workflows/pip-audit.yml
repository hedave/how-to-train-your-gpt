name: pip-audit

on:
  pull_request:
  push:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit locked constraints
        run: |
          set -euo pipefail
          # Local version tags such as torch==2.15.0+cpu are not on PyPI.
          # Strip them so the same upstream release can be looked up, and
          # fail closed if the audit command itself errors.
          python - <<'PY'
          from pathlib import Path
          lines = []
          for line in Path("constraints.txt").read_text().splitlines():
              if line.startswith("#") or line.startswith("--") or not line.strip():
                  continue
              if line.startswith("torch==") and "+" in line:
                  line = line.split("+", 1)[0]
              lines.append(line)
          Path("/tmp/pip-audit-reqs.txt").write_text("\n".join(lines) + "\n")
          PY
          pip-audit -r /tmp/pip-audit-reqs.txt --no-deps --disable-pip --strict --desc on
